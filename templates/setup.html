<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set up administrator · AI Face Recognition</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=mobile-20261014">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand-icon">AI</div>
    <p class="eyebrow">FIRST-TIME SETUP</p>
    <h1>Create the Admin account</h1>
    <p class="section-description">Choose a username and a password with at least 8 characters. The password is stored as a hash, not plain text.</p>
    {% if error %}<p class="message error">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('setup') }}" class="auth-form">
      <label>Admin username<input name="username" type="text" minlength="3" required autocomplete="username"></label>
      <label>Password<input name="password" type="password" minlength="8" required autocomplete="new-password"></label>
      <label>Confirm password<input name="confirm_password" type="password" minlength="8" required autocomplete="new-password"></label>
      <button class="primary-button" type="submit">Create Admin account</button>
    </form>
  </main>
</body>
</html>
